name: Build-Apk

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Validate release metadata
        run: python3 scripts/release_metadata.py validate
      - name: Run app, selector and database regressions
        run: |
          python3 -B -m unittest discover -s scripts -p "test_*.py"
          chmod +x ./gradlew
          ./gradlew gkd-app:testGkdDebugUnitTest gkd-selector:jvmTest gkd-db:jvmTest --stacktrace
      - name: Build optimized verification APK
        # PR and branch CI never receive signing credentials. The tag pipeline signs releases.
        run: ./gradlew gkd-app:assembleGkdPerf --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-apk
          path: gkd-app/build/outputs/apk/gkd/perf/*.apk
          if-no-files-found: error
