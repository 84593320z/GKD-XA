name: Build-Apk

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd secrets info
        env:
          GKD_STORE_FILE_BASE64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
        run: |
          if [ -n "$GKD_STORE_FILE_BASE64" ]; then
            echo "$GKD_STORE_FILE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/gkd.jks"
            echo "GKD_STORE_FILE=$GITHUB_WORKSPACE/gkd.jks" >> gradle.properties
            echo "GKD_STORE_PASSWORD=$GKD_STORE_PASSWORD" >> gradle.properties
            echo "GKD_KEY_ALIAS=$GKD_KEY_ALIAS" >> gradle.properties
            echo "GKD_KEY_PASSWORD=$GKD_KEY_PASSWORD" >> gradle.properties
          else
            echo "no signing secrets configured, fallback to debug signing"
          fi

      - run: echo GKD_RENAME_APK_FLAG=1 >> gradle.properties

      # --- 临时探针（验证 working-tree 防护的脏路径，验证完删除） ---
      - name: GKD working-tree probe
        run: |
          printf 'package li.gkd.app\n\n// GkdWorkingTreeProbe: 只为验证防护而创建的未跟踪文件。\n' \
            > gkd-app/src/main/kotlin/li/gkd/app/GkdWorkingTreeProbe.kt
          printf '\n// GKD working-tree probe: 已跟踪文件的改动标记。\n' \
            >> buildSrc/src/main/kotlin/li/gkd/gradle/Git.kt
          echo "probe untracked sha256:"
          sha256sum gkd-app/src/main/kotlin/li/gkd/app/GkdWorkingTreeProbe.kt
          git status --porcelain=v1
      # --- 探针结束 ---

      - run: chmod 777 ./gradlew
      - run: ./gradlew gkd-app:assembleGkdRelease

      # --- 临时验证（验证完删除） ---
      - name: GKD working-tree verify
        run: |
          WT=gkd-app/build/generated/assets/sourcePaths/working-tree.txt
          echo "--- $WT ---"
          cat "$WT"
          echo "--- gkd-working-tree 快照内容 ---"
          find gkd-app/build/gkd-working-tree -type f | sed 's#.*gkd-working-tree/##' | sort
          echo "--- dirty.patch 字节数 ---"
          wc -c < gkd-app/build/gkd-working-tree/dirty.patch
          echo "--- dirty.patch 头 6 行 ---"
          head -6 gkd-app/build/gkd-working-tree/dirty.patch
      # --- 验证结束 ---

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: gkd-app/build/outputs/apk/gkd/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: gkd-app/build/outputs
