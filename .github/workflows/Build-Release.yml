name: Build-Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Validate tagged source metadata
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_metadata.py validate --tag "$TAG"
      - name: Run all regression gates before loading signing secrets
        run: |
          python3 -B -m unittest discover -s scripts -p "test_*.py"
          chmod +x ./gradlew
          ./gradlew gkd-app:testGkdDebugUnitTest gkd-selector:jvmTest gkd-db:jvmTest --stacktrace
      - name: Build with the repository release key
        env:
          GKD_STORE_FILE_BASE64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${GKD_STORE_FILE_BASE64:?Release signing key is required}"
          : "${GKD_STORE_PASSWORD:?Release signing password is required}"
          : "${GKD_KEY_ALIAS:?Release signing alias is required}"
          : "${GKD_KEY_PASSWORD:?Release key password is required}"
          export GKD_STORE_FILE="$RUNNER_TEMP/gkd-release.jks"
          trap 'rm -f "$GKD_STORE_FILE"' EXIT
          umask 077
          printf '%s' "$GKD_STORE_FILE_BASE64" | base64 --decode > "$GKD_STORE_FILE"
          ./gradlew gkd-app:assembleGkdRelease --no-configuration-cache --stacktrace
      - name: Verify and package the exact signed APK
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_metadata.py package --tag "$TAG" --apk gkd-app/build/outputs/apk/gkd/release/gkd-app-gkd-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            gkd-app/build/outputs/mapping/gkdRelease/**
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release
      - name: Publish all verified assets atomically from a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release-state.json" 2>/dev/null; then
            python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Release already published; assets will not be overwritten")' "$RUNNER_TEMP/release-state.json"
          else
            gh release create "$TAG" --verify-tag --draft --title "GKD-XA $TAG" --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" "release/GKD-XA-$TAG.apk" release/SHA256SUMS release/release-manifest.json release/stable.json release/beta.json --clobber
          if [[ "$TAG" == *beta* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: metadata-main
      - name: Backfill only matching main channel metadata
        run: |
          set -euo pipefail
          python3 scripts/release_metadata.py backfill --root metadata-main --manifest release/release-manifest.json
          cd metadata-main
          if ! git diff --quiet -- version/stable.json version/beta.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version/stable.json version/beta.json
            git commit -m 'chore(version): bind channel metadata to verified release artifact [skip ci]'
            git push origin HEAD:main
          fi
